<!DOCTYPE html>
<html>

<head>

  <title>Parent Login</title>

  <link rel="stylesheet" href="signup_style.css">

</head>

<body>

<div class="login-container">

  <h1>👨‍👩‍👧 Parent Login</h1>

  <input
  type="email"
  id="email"
  placeholder="Parent Email">

  <input
  type="password"
  id="password"
  placeholder="Password">

  <button onclick="login()">
    Login
  </button>

  <p class="signup-text">

    Don't have an account?

    <span onclick="showSignup()">
      Sign Up
    </span>

  </p>

  <div
  id="signupSection"
  style="display:none;">

    <h2>Create Account</h2>

    <input
    type="email"
    id="signupEmail"
    placeholder="Parent Email">

    <input
    type="password"
    id="signupPassword"
    placeholder="Password">

    <button onclick="signup()">
      Create Account
    </button>

  </div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyBW8iUuhn0b9GDIKgIwV70Ba3DBNchU3eE",

  authDomain: "kids-learning-fun-582a8.firebaseapp.com",

  projectId: "kids-learning-fun-582a8",

  storageBucket: "kids-learning-fun-582a8.firebasestorage.app",

  messagingSenderId: "773675393706",

  appId: "1:773675393706:web:5d39d722aa8f19d9d066d3",

  measurementId: "G-8Q9GY4K9RD"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

/* SIGNUP */

window.signup = function(){

  const email =
  document.getElementById(
  "signupEmail"
  ).value;

  const password =
  document.getElementById(
  "signupPassword"
  ).value;

  createUserWithEmailAndPassword(
    auth,
    email,
    password
  )

  .then(() => {

    alert(
    "Account Created Successfully!"
    );

  })

  .catch((error) => {

    alert(error.message);

  });
}

/* LOGIN */

window.login = function(){

  const email =
  document.getElementById(
  "email"
  ).value;

  const password =
  document.getElementById(
  "password"
  ).value;

  signInWithEmailAndPassword(
    auth,
    email,
    password
  )

  .then(() => {

    alert(
    "Login Successful!"
    );

    window.location.href =
    "index.html";

  })

  .catch((error) => {

    alert(error.message);

  });
}

</script>

<script>

function showSignup(){

  const section =
  document.getElementById(
  "signupSection"
  );

  if(section.style.display === "none"){

    section.style.display = "block";

  }else{

    section.style.display = "none";
  }
}

</script>

</body>
</html>
